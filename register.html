<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://zhfehohjkafrcwwqexdy.supabase.co wss://zhfehohjkafrcwwqexdy.supabase.co;">
  <title>RainGuard — Create Account</title>
  <meta name="description" content="Create a RainGuard account to monitor your rainwater tank.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <a href="login.html" class="back-link">← Back to Login</a>
      <div class="login-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2C20 10.48 17.33 6.55 12 2z"/></svg>
        </div>
        <h1>Create Account</h1>
        <p>Join RainGuard</p>
      </div>

      <form id="registerForm" autocomplete="off">
        <div id="registerError" class="login-error"></div>
        <div id="registerSuccess" class="login-error" style="background:rgba(76,175,80,.12);color:#2E7D32;display:none;"></div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required maxlength="32" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="role">Account Type</label>
          <select id="role" required>
            <option value="user">User</option>
            <option value="lgu">LGU</option>
          </select>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required maxlength="64" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" maxlength="64" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Re-enter your password" required minlength="6" maxlength="64" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" id="registerBtn" style="justify-content:center;">Create Account</button>
      </form>

      <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border-light);text-align:center;">
        <p style="font-size:.85rem;color:var(--text-muted);">Already have an account?
          <a href="login.html" style="color:var(--primary);font-weight:600;">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase = createClient(
      'https://zhfehohjkafrcwwqexdy.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoZmVob2hqa2FmcmN3d3FleGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzQ5MzUsImV4cCI6MjA5NjQxMDkzNX0.pDXOR0Oqb0h42FliacE14zobu8KUi-xsuBMm-qTzoWU'
    );
    window._supabase = supabase;

    const errEl = document.getElementById('registerError');
    const okEl  = document.getElementById('registerSuccess');
    const btn   = document.getElementById('registerBtn');

    /* Already signed in → go to dashboard */
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'dashboard.html';

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      errEl.textContent = ''; okEl.style.display = 'none';

      const username = document.getElementById('username').value.trim().slice(0, 32);
      const email    = document.getElementById('email').value.trim().toLowerCase().slice(0, 64);
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const roleSel  = document.getElementById('role').value;
      const role     = ['user', 'lgu'].includes(roleSel) ? roleSel : 'user';

      if (!username || !email || !password) { errEl.textContent = 'Please fill in all fields.'; return; }
      if (password.length < 6)              { errEl.textContent = 'Password must be at least 6 characters.'; return; }
      if (password !== confirm)             { errEl.textContent = 'Passwords do not match.'; return; }

      btn.disabled = true; btn.textContent = 'Creating…';
      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: {
          data: { username, role },
          /* Confirmation link returns the user to the login page (this origin),
             so it works on localhost during dev and on the deployed domain alike. */
          emailRedirectTo: window.location.origin + '/login.html?confirmed=1'
        }
      });
      btn.disabled = false; btn.textContent = 'Create Account';

      if (error) { errEl.textContent = error.message; return; }

      /* Email already registered (Supabase obfuscates this as a user with no identities) */
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        errEl.textContent = 'This email is already registered. Try logging in.';
        return;
      }

      if (data.session) {
        /* Email confirmation is OFF → signed in immediately */
        window.location.href = 'dashboard.html';
      } else {
        /* Email confirmation is ON → must confirm before logging in */
        okEl.style.display = 'block';
        okEl.textContent = 'Account created! Check your email to confirm, then log in.';
        document.getElementById('registerForm').reset();
      }
    });
  </script>
</body>
</html>
